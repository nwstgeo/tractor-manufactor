<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" font-family="sans-serif" font-size="12">
<text x="20" y="20" font-size="14" font-weight="bold">Tractor Supply Chain System Design (Stage 1)</text>
<g><rect x="20" y="40" width="170" height="150" fill="#eef" stroke="#333"/><text x="30" y="60" font-weight="bold">Info Sources</text><text x="30" y="80">Tractor Failure Data</text><text x="30" y="98">Customer Demand History</text><text x="30" y="116">Supply fluctuation history</text><text x="30" y="134">Supply Delays Now+History</text><text x="30" y="152">Buy/Finance/Repair market</text><text x="30" y="170">Macro indicators</text></g>
<g><rect x="230" y="40" width="200" height="150" fill="#efe" stroke="#333"/><text x="240" y="60" font-weight="bold">Topic Agents (LLM stubs)</text><text x="240" y="80">Failure Compilation -&gt; H</text><text x="240" y="98">Supply Delay Trends -&gt; S</text><text x="240" y="116">Order/Feedback Summary -&gt; O,F,R</text><text x="240" y="134">(Chain Trends: out of scope)</text></g>
<g><rect x="470" y="40" width="180" height="150" fill="#fee" stroke="#333"/><text x="480" y="60" font-weight="bold">Trained Models</text><text x="480" y="80">H: failure+availability+needs</text><text x="480" y="98">O: demand forecast</text><text x="480" y="116">S: delay forecast (p50/p90)</text><text x="480" y="134">F: macro scaling (pass-thru)</text><text x="480" y="152">R: order/expedite synthesis</text></g>
<g><rect x="690" y="40" width="190" height="150" fill="#ffe" stroke="#333"/><text x="700" y="60" font-weight="bold">API + UI boxes</text><text x="700" y="80">/events (Orders, H)</text><text x="700" y="98">/forecast/orders-3mo (O&amp;F,R)</text><text x="700" y="116">/actions (R)</text><text x="700" y="134">/orders/proposed+approve (R)</text><text x="700" y="152">/inventory (H)</text><text x="700" y="170">/production-schedule (H)</text></g>
<g stroke="#333" marker-end="url(#a)"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#333"/></marker></defs>
<line x1="190" y1="115" x2="228" y2="115"/><line x1="430" y1="115" x2="468" y2="115"/><line x1="650" y1="115" x2="688" y2="115"/></g>
<text x="20" y="220">Data: data/synthetic_output/events.csv (10k) + parts.csv (50k) + flat_view.csv; seed 42. Fill 0.928 starting point; R target &gt;=0.98 forward.</text>
<text x="20" y="240">Models take agent summaries only (split inputs); agents alone read frames. See docs/system_design.md.</text>
</svg>
